name: build

on:
  push:
    branches: [feature/hubuddy-app, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (creates the tag) when the build passes
        type: boolean
        default: false
      version:
        description: Version for the release, e.g. 3.3.0
        default: "3.3.0"

permissions:
  contents: read

jobs:
  windows:
    name: Windows program and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller
      - name: Agent tests
        working-directory: agent
        run: |
          $env:PYTHONPATH = "tests;."
          python -m unittest discover -s tests -v
      - name: Build Hubuddy.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi agent/hubuddy.spec
      - name: Self-test the portable program
        run: |
          $p = Start-Process -FilePath dist\Hubuddy.exe -ArgumentList "--selftest","--selftest-output","$PWD\selftest-portable.json" -Wait -PassThru
          Get-Content selftest-portable.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Hubuddy.iss "/DAppVersion=3.3.0" "/DSourceExe=$PWD\dist\Hubuddy.exe"
      - name: Install silently, self-test the installed program, uninstall
        run: |
          $dir = "$env:RUNNER_TEMP\HubuddyInstalled"
          $i = Start-Process -FilePath dist\HubuddySetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=firewall","/DIR=$dir" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "installer failed ($($i.ExitCode))" }
          netsh advfirewall firewall show rule name=Hubuddy
          $p = Start-Process -FilePath "$dir\Hubuddy.exe" -ArgumentList "--selftest","--selftest-output","$PWD\selftest-installed.json" -Wait -PassThru
          Get-Content selftest-installed.json
          if ($p.ExitCode -ne 0) { throw "installed self-test failed ($($p.ExitCode))" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall failed ($($u.ExitCode))" }
          if (Test-Path "$dir\Hubuddy.exe") { throw "uninstall left the program behind" }
      - name: Checksums
        run: |
          Get-FileHash dist\Hubuddy.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Hubuddy.exe" } | Set-Content dist\Hubuddy.exe.sha256
          Get-FileHash dist\HubuddySetup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  HubuddySetup.exe" } | Set-Content dist\HubuddySetup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hubuddy-windows
          path: |
            dist/Hubuddy.exe
            dist/HubuddySetup.exe
            dist/*.sha256
            selftest-*.json

  linux:
    name: Linux package (Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the .deb
        run: bash packaging/linux/build_deb.sh
      - name: "Install it on a clean Debian 12 (64-bit), self-test, run the agent tests with Debian's own Python 3.11 and libraries"
        run: |
          docker run --rm -v "$PWD:/w" debian:12 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq /w/dist/hubuddy_*_all.deb >/dev/null
            python3 --version; dpkg -s python3-cryptography | grep "^Version"
            hubuddy --selftest
            hubuddy --firewall-help | head -3
            cd /w/agent
            PYTHONPATH=/w/agent/tests:/usr/lib/hubuddy:/usr/lib/hubuddy/vendor python3 -m unittest discover -s tests
          '
      - name: "Same on 32-bit Debian 12 (best effort, the hosted runner network for 32-bit containers is unreliable)"
        continue-on-error: true
        run: |
          docker run --rm --platform linux/386 --network host -v "$PWD:/w" i386/debian:12 bash -euxo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq /w/dist/hubuddy_*_all.deb >/dev/null
            hubuddy --selftest
            cd /w/agent
            PYTHONPATH=/w/agent/tests:/usr/lib/hubuddy:/usr/lib/hubuddy/vendor python3 -m unittest discover -s tests
          '
      - uses: actions/upload-artifact@v4
        with:
          name: hubuddy-linux
          path: |
            dist/*.deb
            dist/*.sha256

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent requirements (for the interop test)
        run: pip install -r agent/requirements.txt
      - name: Unit tests, lint and release build
        working-directory: android/hubuddy
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Interop test (real app client against the real PC program)
        run: bash tools/interop.sh
      - name: Checksum
        run: |
          cp android/hubuddy/app/build/outputs/apk/release/app-release.apk Hubuddy.apk
          sha256sum Hubuddy.apk | sed 's/Hubuddy.apk/Hubuddy.apk/' > Hubuddy.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hubuddy-android
          path: |
            Hubuddy.apk
            Hubuddy.apk.sha256
            android/hubuddy/app/build/reports/tests/testDebugUnitTest

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v${{ inputs.version }}"; fi
          ver="${tag#v}"
          mv "$(find assets/hubuddy-linux -name 'hubuddy_*_all.deb' | head -n1)" "assets/hubuddy_${ver}_all.deb"
          mv "$(find assets/hubuddy-android -name Hubuddy.apk | head -n1)" "assets/Hubuddy-${ver}.apk"
          rm -f assets/hubuddy-android/Hubuddy.apk.sha256
          mv "$(find assets/hubuddy-windows -name Hubuddy.exe | head -n1)" "assets/Hubuddy-${ver}.exe"
          mv "$(find assets/hubuddy-windows -name HubuddySetup.exe | head -n1)" "assets/HubuddySetup-${ver}.exe"
          (cd assets && sha256sum Hubuddy-${ver}.apk Hubuddy-${ver}.exe HubuddySetup-${ver}.exe hubuddy_${ver}_all.deb > SHA256SUMS.txt)
          files=("assets/Hubuddy-${ver}.apk" "assets/Hubuddy-${ver}.exe" "assets/HubuddySetup-${ver}.exe" "assets/hubuddy_${ver}_all.deb" assets/SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hubuddy ${ver}" --generate-notes "${files[@]}"
          fi
      - name: Also list the downloads in releases/ on the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="${{ inputs.version }}"; fi
          git clone --quiet --depth 1 --branch feature/hubuddy-app "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cp "assets/Hubuddy-${ver}.apk" "assets/Hubuddy-${ver}.exe" "assets/HubuddySetup-${ver}.exe" "assets/hubuddy_${ver}_all.deb" repo/releases/
          cd repo/releases
          for f in "Hubuddy-${ver}.apk" "Hubuddy-${ver}.exe" "HubuddySetup-${ver}.exe" "hubuddy_${ver}_all.deb"; do sha256sum "$f" > "$f.sha256"; done
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases
          git commit -m "Add Hubuddy ${ver} downloads built by CI [skip ci]" || exit 0
          git push origin feature/hubuddy-app
